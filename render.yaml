services:
  - type: web
    name: car-dealership-backend
    env: docker
    repo: https://github.com/shubhamkataria2005/aicar_dealership_backend
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_URL
        sync: false
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: katariashubham0101@gmail.com
      - key: MAIL_FROM_NAME
        value: "Shubham's Car Dealership"
      - key: CORS_ALLOWED_ORIGINS
        value: https://dealership.shubhamkataria.com,https://ai-car-dealership-frontend.onrender.com,http://localhost:5173,http://localhost:5174,http://localhost:3000
